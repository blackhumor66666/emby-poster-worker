name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      # app.py defaults these to /data/*, which does not exist on a runner.
      # tests/__init__.py sets the same defaults for local runs.
      CACHE_DIR: ${{ runner.temp }}/pw-cache
      ADMIN_DATA_DIR: ${{ runner.temp }}/pw-config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile every module
        run: python -m py_compile *.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
